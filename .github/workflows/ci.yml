name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: >
          xcodebuild test
          -scheme OnDeck
          -destination 'platform=macOS'
          -only-testing:OnDeckTests
          CODE_SIGNING_ALLOWED=NO
