services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ondeck
      POSTGRES_PASSWORD: ondeck
      POSTGRES_DB: ondeck
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondeck -d ondeck"]
      interval: 2s
      timeout: 5s
      retries: 20

  server:
    build: .
    environment:
      DATABASE_URL: postgres://ondeck:ondeck@db:5432/ondeck
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
