name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: >
          xcodebuild test
          -scheme OnDeck
          -destination 'platform=macOS'
          -only-testing:OnDeckTests
          CODE_SIGNING_ALLOWED=NO

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
